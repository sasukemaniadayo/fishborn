<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フィッシュボーン</title>
<style>
:root{color-scheme:only light}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2a1a;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{z-index:5;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));text-align:right;pointer-events:none;filter:drop-shadow(0 3px 6px #000)}
#tm{position:relative;padding:10px 12px;border-radius:9px;border:3px solid #4a4538;background:radial-gradient(circle at 7px 7px,#f6f3e8 0 1.5px,#7a735f 3px,transparent 3.6px),radial-gradient(circle at calc(100% - 7px) 7px,#f6f3e8 0 1.5px,#7a735f 3px,transparent 3.6px),radial-gradient(circle at 7px calc(100% - 7px),#f6f3e8 0 1.5px,#7a735f 3px,transparent 3.6px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#f6f3e8 0 1.5px,#7a735f 3px,transparent 3.6px),linear-gradient(145deg,#d9d3c3 0%,#a29b86 38%,#cfc8b3 52%,#7f7863 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.65),inset 0 -3px 4px rgba(0,0,0,.4),0 3px 6px rgba(0,0,0,.55)}
#tmi{background:#000;border:4px solid #3a362b;border-radius:5px;padding:6px 10px;box-shadow:inset 0 0 8px #000,0 1px 0 rgba(255,255,255,.45);line-height:0}
#tmsvg{display:block;width:128px;height:auto}
@media (max-width:600px),(pointer:coarse){#tmsvg{width:64px}#tm{padding:5px 6px;border-width:2px;border-radius:5px}#tmi{padding:3px 5px;border-width:2px}}
#gas{position:fixed;left:0;top:0;pointer-events:none;z-index:4}
#sb{position:fixed;right:calc(6px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
#sbt{position:relative;width:44px;height:150px;margin:16px 0;touch-action:none;pointer-events:auto}
#sbt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:rgba(255,255,255,.4);border-radius:3px}
#sbk{position:absolute;left:50%;top:0%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:3px solid #c4161c;box-sizing:border-box}
#bk{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-shadow:0 1px 3px #000}
#bkr{display:flex;gap:6px}
#pause,#pvPause{text-align:center}
#pause::after,#pvPause::after{content:"一時停止";display:block;height:0;overflow:hidden;visibility:hidden}   /* 「再開」のときも、一番長い「一時停止」と同じ幅にする */
#back,#pause,#pvBack,#pvPause{font-size:14px;padding:6px 12px;border-width:2px;border-radius:10px;opacity:.92}
#pvBar{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:9;display:none;gap:6px;text-shadow:0 1px 3px #000}
body.preview #pvBar{display:flex}
body.preview #tt{display:none!important}
#pv{display:block;margin:12px auto 0;padding:8px 28px;font-size:16px;letter-spacing:.15em;background:rgba(0,0,0,.35)}
#cn{font-size:12px;font-weight:700;letter-spacing:.05em;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px}
body.title #btns,body.title #hud,body.title #bk,body.title:not(.preview) #sb{display:none}
#tt{position:fixed;inset:0;z-index:8;overflow:auto;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 25%,rgba(150,12,20,.5),rgba(30,0,4,.72) 75%);padding:16px;box-sizing:border-box}
#ttw{width:min(560px,100%);text-align:center;margin:auto}
#tth{margin:0 0 4px;font-size:clamp(40px,11vw,72px);font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;text-shadow:0 4px 0 #6d0a10,0 8px 18px rgba(0,0,0,.6)}
#tth small{display:block;font-size:clamp(13px,3.6vw,20px);font-style:normal;letter-spacing:.5em;margin-top:8px;color:#ffd6d6}
.sec{margin:18px 0 8px;font-size:13px;font-weight:800;letter-spacing:.3em;color:#ff8a8f}
#cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:min(36vh,230px);overflow-y:auto;padding:2px}
.cc{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:4px 2px;border:2px solid #7d2a2f;border-radius:8px;background:linear-gradient(#3a0a0e,#1c0306);color:#fff}
.cc i{font-style:normal;font-size:11px;color:#ff9a9e;letter-spacing:.1em}
.cc b{font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.cc.on{border-color:#ffe14d;box-shadow:0 0 14px rgba(255,225,77,.6);background:linear-gradient(#c4161c,#6d0a10)}
.cc.lk{opacity:.45;border-style:dashed;cursor:default}
.cc.lk b{font-size:10px;letter-spacing:.1em}
#md{position:relative;display:flex;width:min(480px,100%);height:50px;margin:0 auto;border-radius:25px;border:3px solid #fff;background:#1a0204;overflow:hidden}
#md::before{content:"";position:absolute;top:0;bottom:0;left:0;width:33.333%;background:#c4161c;border-radius:22px;transition:transform .2s}
#md.p1::before{transform:translateX(100%)}
#md.p2::before{transform:translateX(200%)}
#md button{position:relative;flex:1;background:none;border:0;font-size:13px;line-height:1.15;padding:0 4px;border-radius:0}
#go{margin-top:22px;padding:14px 64px;font-size:28px;letter-spacing:.15em}
#hint{margin:10px 0 0;font-size:15px;line-height:1.6;color:#ffd6d6;min-height:1.6em}
#mesh{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
#mdd{white-space:pre-line;margin-top:8px;font-size:14px;line-height:1.5;color:#ffd6d6;min-height:1.5em}
#btns{z-index:5;position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
button{font-family:inherit;font-size:26px;font-weight:700;color:#fff;background:#c4161c;border:3px solid #fff;border-radius:14px;cursor:pointer;touch-action:manipulation}
button:active{background:#8e0f14}
#btns button{flex:1;height:84px;opacity:.92}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(70,0,0,.65);text-align:center;padding:20px}
#ov h1{font-size:44px;margin:0 0 12px;text-shadow:0 3px 6px #000}
#ov p{font-size:18px;line-height:1.6;margin:0 0 22px;white-space:pre-line}
.hide{display:none!important}
#ov.ghost{background:transparent;align-items:flex-start;pointer-events:none}
#ov.ghost>div{pointer-events:auto;background:rgba(70,0,0,.85);border-radius:14px;padding:10px 24px;margin-top:80px}
#ov.ghost h1{font-size:30px;margin:0 0 4px}
#ov.ghost p{font-size:15px;margin:0 0 10px}
#b1{background:#1f9d46}#b1:active{background:#157a34}
#b2{background:#e0b800;color:#3b2a00}#b2:active{background:#b89400}
#ov.end{pointer-events:none}
#ov.end>div{pointer-events:auto}
#xn{display:block;margin-top:8px;font-size:12px;color:#ffd6d6}
#xt{display:block;box-sizing:border-box;width:min(340px,80vw);margin:6px auto 0;padding:6px;font-size:13px;color:#fff;background:#222;border:1px solid #888;border-radius:6px;resize:none}
#xp{display:inline-block;margin-top:12px;padding:10px 24px;font-size:18px;font-weight:700;color:#fff;background:#000;border:2px solid #fff;border-radius:10px;text-decoration:none}
#b1.retry{background:#c4161c}#b1.retry:active{background:#8e0f14}
@media (orientation:landscape) and (max-height:520px){
 #btns{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));gap:8px}
 #btns button{height:46px;font-size:18px;border-width:2px;border-radius:10px}
 #sb{font-size:10px;gap:2px}#sbt{height:84px;margin:12px 0}
 #ov h1{font-size:30px;margin:0 0 6px}#ov p{font-size:14px;margin:0 0 10px}
 #ov.ghost>div{padding:6px 16px;margin-top:46px}#ov.ghost h1{font-size:22px;margin:0 0 2px}#ov.ghost p{font-size:12px;margin:0 0 4px}
 #bk{gap:2px}#back,#pause,#pvBack,#pvPause{font-size:12px;padding:4px 8px}#pv{margin-top:6px;padding:5px 20px;font-size:13px}#cn{font-size:10px}
 #tth{font-size:34px}#tth small{font-size:11px;margin-top:2px}.sec{margin:5px 0 3px}#cg{gap:5px;max-height:38vh;grid-template-columns:repeat(6,1fr)}.cc{padding:6px 2px}
 #md{height:38px}#go{margin-top:6px;padding:8px 40px;font-size:20px}#mdd{font-size:12px;margin-top:4px}#hint{margin-top:6px;font-size:12px}
}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
 #ov.ghost{justify-content:flex-end;align-items:flex-start;padding:0}
 #ov.ghost>div{margin:calc(10px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-right,0px)) 0 0;padding:0 12px;height:54px;box-sizing:border-box;display:flex;align-items:center;gap:10px;border-radius:8px}
 #ov.ghost h1{font-size:20px;margin:0;white-space:nowrap}
 #ov.ghost p{font-size:12px;margin:0;white-space:nowrap;line-height:1.2}
}
</style>
</head>
<body class="title">
<div id="hud"><div id="tm"><div id="tmi"><svg id="tmsvg" viewBox="0 0 146 68"></svg></div></div></div>
<div id="mesh"><canvas id="mcv"></canvas></div><div id="bk"><div id="bkr"><button id="back">◀ タイトル</button><button id="pause" type="button">一時停止</button></div><div id="cn">Season33</div></div><canvas id="gas"></canvas><div id="sb"><div>カメラ</div><div id="sbv">0.00m</div><div id="sbt"><div id="sbk"></div></div></div><div id="btns"><button id="b1">1歩 ←</button><button id="b2">2歩 →</button></div>
<div id="tt"><div id="ttw">
  <h1 id="tth">FISHBONE<small>フィッシュボーン</small></h1>
  <div class="sec">COURSE SELECT</div><div id="cg"></div><p id="hint"></p>
  <div class="sec">PLAYER SELECT</div><div id="md"><button data-m="normal">山田さん</button><button data-m="bolt">ヴォルトマン</button><button data-m="vol">シスター・ボルダラー</button></div><div id="mdd"></div>
  <button id="go">START</button>
  <button id="pv" type="button">PREVIEW</button>
</div></div>
<div id="pvBar"><button id="pvBack" type="button">← 戻る</button><button id="pvPause" type="button">一時停止</button></div>
<div id="ov" class="hide"><div><h1 id="ot"></h1><p id="om"></p><button id="xp" class="hide" type="button">Xにポストする</button><small id="xn" class="hide">投稿画面を開けませんでした。下の文をコピーして、Xに貼り付けてください。</small><textarea id="xt" class="hide" readonly rows="3"></textarea></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= パラメータ(ここを書き換えて調整) =================

// --- テキスト ---
const PLAYERS={                                                  // プレイヤー(name=名前 / desc=説明、\nで改行)
  normal:{name:'山田さん',desc:'通常モード\n史上最強のバランス系エリアを攻略セヨ！'},
  bolt:{name:'ヴォルトマン',desc:'アルティメットモード\n見えにくい視界で緑山を救え！'},
  vol:{name:'シスター・ボルダラー',desc:'クレイジーモード\n見えにくい視界と大きな体を持つ壁の妖精となれ！'}
};

// --- コース定義(最大8コース。nullはロック表示) ---
const COURSE_SLOTS_MIN=8;   // コース選択に最低限並べる枠の数(足りない分はLOCKED表示)。コースが増えれば自動で増え、スクロールで選ぶ
const COURSE_DEFAULTS={      // 各コースで省略した項目はここの値になる
  platforms:4,               // 足場の数
  spacing:1.2,               // 足場の中心間隔(m)
  axisX:-.3,                 // 回転軸のx位置(プレイヤーから見て左がマイナス)
  axisStyle:'solid',         // 回転軸の見た目 'solid'=8角柱 / 'wire'=パイプの8角柱ワイヤーフレーム
  axisSpiral:false,          // 8角柱の黒い二重線のらせん模様(Season33限定デザイン)
  platformColors:['redGrey','redGrey','redGrey','redGrey','yellowRed','yellowRed'],   // 足場の色。足場番号1から順にプリセット名を指定(番号がこの配列より多い足場は最後の指定を使う)
  period:5                   // 軸が1周する秒数(区間ごとに上書き可)
};
// segments=回転軸を区間に分けたもの(スタート側から順に。数=couplingsの数+1)
//   dir=+1 正回転(反時計・赤) / -1 逆回転(黄)   period=この区間の周期(秒)   phase=この区間だけ回転角をずらす(度。正の値=プレイヤー目線で反時計回り。回転方向dirに関わらず同じ向き。例: 22.5)   boneColors=この区間のボーンの配色('redGrey'/'yellowRed'。省略時は正回転=redGrey・逆回転=yellowRed)
//   rows: [足場番号,[面…]] または [足場番号,[面…],'配色'](その行だけ配色を指定)
//   rows=[[足場番号(.5は足場の間), [8角柱の辺番号(辺1=真上(12時)、進行方向から見て時計回りに増える)]], ...]
// couplings=区間と区間の間に置くカップリング/カバーボックス。at=足場番号(.5刻み)  cover=カバーボックスを置く(省略時true) coupling=カップリングを置く(省略時true)
//   どちらか片方だけも選べる。軸の区間の隙間は、カバーボックスがあればその長さ、なければカップリングの長さ
const COURSE_DEFS=[
// 01 
  {name:'Season33',info:'記念すべき初登場。ポールの数は18本。',axisSpiral:true,
    segments:[{dir:1,rows:[[1,[1,4]],[1.5,[7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[3,7]],[4,[2,4,6,8]]]}]},
// 02
  {name:'Season34',info:'ポールが2本追加され20本に増量。',
    axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[3,7]],[4,[2,4,6,8]]]}]},
// 03
  {name:'Season35',info:'ポールがさらに2本追加され22本に増量。',
    axisX:-.30, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]}]},
// 04
  {name:'Season36',info:'ポールの数は22本。回転軸が左に移動。',
    axisX:-.45, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]}]},
// 05
  {name:'Season37',info:'逆回転が登場。ポールの数は31本。',
    platforms:6,axisX:-.45, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]},
      {dir:-1,rows:[[5,[2,6,8]],[5.5,[1,3,7]],[6,[2,6,8]]]}],
    couplings:[{at:4.5}]},
// 06
  {name:'Season38',info:'ポールの数は31本。回転軸が足場の真上にあるぞ。',
    platforms:6,axisX:0, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]},
      {dir:-1,rows:[[5,[2,6,8]],[5.5,[1,3,7]],[6,[2,6,8]]]}],
    couplings:[{at:4.5}]},
// 07
  {name:'Season39&40',info:'ポールの数は31本。初めて回転軸が右にずれた。',
    platforms:6,axisX:.30, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]},
      {dir:-1,rows:[[5,[2,6,8]],[5.5,[1,3,7]],[6,[2,6,8]]]}],
    couplings:[{at:4.5}]},
// 08
  {name:'Season41',info:'ポールの数は31本。回転軸がさらに右に移動。',
    platforms:6,axisX:.45, axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]]]},
      {dir:-1,rows:[[5,[2,6,8]],[5.5,[1,3,7]],[6,[2,6,8]]]}],
    couplings:[{at:4.5}]},
// 09
  {name:'World Cup 2022',info:'しれっとポールが2本追加され、33本に増量。',
    platforms:6,axisX:.30,axisStyle:'wire',period:6,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,5,7]],[4,[2,4,6,8]]]},
      {dir:-1,rows:[[5,[2,6,8]],[5.5,[1,3,7]],[6,[2,4,6,8]]]}],
    couplings:[{at:4.5}]},
// 10
  {name:'Season42',info:'ポールの数は37本。2本並んだポールにびっくり。',
    platforms:6,axisX:.30,axisStyle:'wire',period:7.5,
    segments:[
      {dir:1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,5,7]],[4,[2,4,6,8]],[4.25,[2,4,6,8]]]},
      {dir:-1,rows:[[4.75,[2,6,8]],[5.5,[1,3,7]],[6,[2,4,6,8]]]}],
    couplings:[{at:4.5,cover:false}]},
// 11
  {name:'Season43',info:'ポールの数は38本。回転が相入れ替わる。',
    platforms:6,axisX:.30,axisStyle:'wire',period:7.5,
    segments:[
      {dir:-1,rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,4,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]],[4.25,[2,4,6,8]]]},
      {dir:1,rows:[[4.85,[2,4,6,8]],[5.5,[1,3,5,7]],[6,[2,4,6,8]]]}],
    couplings:[{at:4.5,cover:false}]},
// 12
  {name:'Season44 仮仕様',info:'ポールの数は55本。1列に5本の骨ってできるんだ。',
    platforms:8,axisX:.30,axisStyle:'wire',period:7,platformColors:['redGrey','redGrey','redGrey','redGrey','yellowRed','yellowRed','redGrey','redGrey'], 
    segments:[
      {dir:-1,boneColors:'redGrey', rows:[[1,[1,4,6]],[1.5,[3,5,7]],[2,[1,3,6]],[2.5,[1,5,7]],[3,[2,5,8]],[3.5,[1,3,7]],[4,[2,4,6,8]],[4.25,[2,4,6,8]]]},
      {dir:1,boneColors:'yellowRed', rows:[[4.85,[2,4,6,8]],[5.5,[1,5,7]],[6,[2,4,6,8]],[6.5,[1,3,5,7]]]},
      {dir:-1,boneColors:'redGrey', rows:[[7,[2,4,7]],[7.25,[1,6]],[8,[2,4,6,8]],[8.5,[1,2,3,5,7]]]}],
    couplings:[{at:4.5,cover:false},{at:6.8,cover:false}] }
];


// --- コース(単位m) ---
const PLATFORM_RADIUS=.15;   // 足場の半径(直径30cm)
const DECK_HEIGHT=1;         // スタート・ゴール台と足場上面の高さ

function instPipes(TS,r,mat,parent){   // 線分のリスト[[x0,y0,z0,x1,y1,z1],...]をパイプとして1回の描画でまとめて作る
  const o=new THREE.Object3D(),u=new THREE.Vector3(0,1,0),d=new THREE.Vector3();
  const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(r,r,1,5),mat,TS.length);
  TS.forEach((s,i)=>{d.set(s[3]-s[0],s[4]-s[1],s[5]-s[2]);const L=d.length();o.position.set((s[0]+s[3])/2,(s[1]+s[4])/2,(s[2]+s[5])/2);o.quaternion.setFromUnitVectors(u,d.normalize());o.scale.set(1,L,1);o.updateMatrix();im.setMatrixAt(i,o.matrix);});
  im.frustumCulled=false;parent.add(im);return im;
}
function strut(TS,a,b,w,panel){   // コーナーブロックの中心a→bを結ぶ部材。両端をブロックの面(半分の寸法)まで縮め、ブロックの間を完全なパネルで埋める
  const ax=[0,1,2].find(i=>Math.abs(a[i]-b[i])>1e-6),sg=Math.sign(b[ax]-a[ax]),h=CORNER_BLOCK/2,a2=[...a],b2=[...b];
  a2[ax]+=sg*h;b2[ax]-=sg*h;lattice(TS,a2,b2,w,panel);
}
function lattice(TS,a,b,w,panel=.55){   // 点a→bを結ぶ角トラス(a,bはx,y,zのうち1つだけ違う)。断面は一辺2w
  const ax=[0,1,2].find(i=>Math.abs(a[i]-b[i])>1e-6),o=[0,1,2].filter(i=>i!==ax);
  const n=Math.max(1,Math.round(Math.abs(b[ax]-a[ax])/panel)),p=(b[ax]-a[ax])/n,C=[[-w,-w],[w,-w],[w,w],[-w,w]];
  const P=(t,k)=>{const v=[a[0],a[1],a[2]];v[ax]=a[ax]+t*p;v[o[0]]+=C[k][0];v[o[1]]+=C[k][1];return v;};
  for(let k=0;k<4;k++)TS.push([...P(0,k),...P(n,k)]);
  for(let i=0;i<=n;i++)for(let k=0;k<4;k++){TS.push([...P(i,k),...P(i,(k+1)%4)]);if(i<n)TS.push([...P(i,k),...P(i+1,(k+1)%4)]);}
}
function mkTruss(z,mat,parent,tall,lowSide,lowPr){   // 池の端の門型トラス。tall=カップリング/カバーボックスを吊るため、支柱を伸ばして上端にも奥行き方向の梁を付ける。lowSide指定時のみ、下段の梁(モーターなどが乗る奥行き方向の梁)をその断面(外面の1辺)・パイプ半径lowPrにする
  const TS=[],TL=[],hb=CORNER_BLOCK/2;
  const hp=(BY+.2)*(tall?PILLAR_EXT_RATIO:1),lw=lowSide?lowSide/2-lowPr:TW,topY=hp-TW;   // 支柱の高さ(カップリング/カバーボックスのコースは1.5倍に伸ばす) / 上端の梁の中心の高さ
  const cb=(x,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(CORNER_BLOCK,CORNER_BLOCK,CORNER_BLOCK),mat);m.position.set(x,y,z);parent.add(m);};   // コーナーブロック
  [-TRUSS_X,TRUSS_X].forEach(cx=>{
    lattice(TS,[cx,0,z],[cx,BY-hb,z],TW);   // 支柱: 地面から、下段の梁のコーナーブロックの下面まで
    if(tall)strut(TS,[cx,BY,z],[cx,topY,z],TW);   // 支柱: 下段のブロックの上面から、上端のブロックの下面まで
    cb(cx,BY);if(tall)cb(cx,topY);
  });
  strut(lowSide?TL:TS,[-TRUSS_X,BY,z],[TRUSS_X,BY,z],lw);   // 下段の梁: 左右のブロックの間
  if(tall)strut(TS,[-TRUSS_X,topY,z],[TRUSS_X,topY,z],TW);   // 支柱の上端を囲う、奥行き方向のトラス
  if(TL.length)instPipes(TL,lowPr,mat,parent);
  return instPipes(TS,.03,mat,parent);
}
const AXIS_SPIRAL_LINES=6;      // らせん(黒い線)の本数: 軸の区間の長さ方向に1本の線をたどったとき、どの回転角でも常にこの本数の黒い線と交わる(2本1組の二重線なので偶数にする)
const AXIS_SPIRAL_LINE_PX=9;    // 黒い線の太さ(テクスチャ256pxあたりのpx。大きいほど太い)
function axisTex(len){   // Season33のらせん。向きは従来と逆(左右反転)
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#b01419';g.fillRect(0,0,256,256);g.strokeStyle='#000';g.lineWidth=AXIS_SPIRAL_LINE_PX;
  for(const o of[-256,0,256])for(const d of[0,34]){g.beginPath();g.moveTo(o+d+256,0);g.lineTo(o+d,256);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,AXIS_SPIRAL_LINES/2);return t;   // 1タイルに黒い線が2本 → 区間の長さにタイルをLINES/2枚並べる
}

function axisMesh(style,lo,hi,dir,spiral,idx){   // 区間(z=hi〜lo)の回転軸
  const len=hi-lo,zc=(hi+lo)/2,g=new THREE.Group();g.position.z=zc;
  if(style==='wire'){
    const V=[...Array(8)].map((_,k)=>{const f=Math.PI/8+k*Math.PI/4;return[AR*Math.cos(f),AR*Math.sin(f)];}),TS=[],h=len/2;
    V.forEach(([x,y])=>TS.push([x,y,-h,x,y,h]));
    for(let k=0;;k++){   // 回転方向のパイプ(リング)は、ボーン中心と同じ位置・間隔(足場の半ピッチごと)
      const z=-k*S/2;if(z<lo-1e-6)break;if(z>hi+1e-6)continue;
      for(let j=0;j<8;j++){const[a,b]=V[j],[c,d]=V[(j+1)%8];TS.push([a,b,z-zc,c,d,z-zc]);}
    }
    if(WIRE_ENDPLATE){   // 区間の両端面に、厚み3cmの8角形の板を貼る(軸と同じ頂点・区間の色。端面のすぐ内側に置き、カップリングの箱の面とのちらつきを避ける)
      const pg=new THREE.CylinderGeometry(AR,AR,WIRE_ENDPLATE_THICK,8,1,false,Math.PI/8).rotateX(Math.PI/2);   // 厚み付きの8角形の板(頂点は軸の8角形と同じ向き)
      [-1,1].forEach(k=>{const m=new THREE.Mesh(pg,wireMats[idx%wireMats.length]);m.position.z=k*(h-WIRE_ENDPLATE_INSET-WIRE_ENDPLATE_THICK/2);g.add(m);});   // 板の外面が端面のすぐ内側に来るよう、厚みは内側へ
    }
    instPipes(TS,WIRE_PIPE_RADIUS,wireMats[idx%wireMats.length],g);
  }else{
    const geo=new THREE.CylinderGeometry(AR,AR,len,8).rotateX(Math.PI/2);
    if(spiral){const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:axisTex(len)}));m.rotation.z=Math.PI/8;g.add(m);}
    else{const f=geo.toNonIndexed();f.computeVertexNormals();const m=new THREE.Mesh(f,M(dir>0?0xb01419:REVERSE_COLORS.body));m.rotation.z=Math.PI/8;g.add(m);}
  }
  return g;
}
const segAngle=sg=>sg.w*T+sg.dir*PH+sg.phase;   // 面1が12時の位置を基準(角度0)に、初期回転角PH(乱数)を回転方向の符号つきで加え、時間でw*T回る。正回転=+PH / 逆回転=−PH(同値異符号)

// ================= 当たり判定 =================
function bodyHW(y){
  for(const[a,wa,b,wb]of bd.seg){if(y<=b){const k=b>a?Math.max(0,(y-a)/(b-a)):0;return(wa+(wb-wa)*k)/2;}}
  return bd.seg[bd.seg.length-1][3]/2;
}
const graceMap=new Map();   // ボーンごとの接触の記録(最初に接触したときの進入方向・回転角・その瞬間の状態)
const FAIL_ARROW_MODE='normal';   // 失敗画面の矢印: 'motion'=接触点でのボーンの動く向き(体を押す向き) / 'normal'=接触面の向き(ボーン→体の最短方向)
function snapContact(c){   // 判定範囲に入った最初の瞬間の状態(失敗画面で、この瞬間に巻き戻して見せる)
  const sg=c.b.seg,rx=c.x-AXX,ry=c.y-AY,vel=new THREE.Vector3(-ry,rx,0).multiplyScalar(sg.w);
  if(vel.length()<1e-6)vel.set(c.push,0,0);vel.normalize();
  return {T,time,pz,pos:-pz*2/S,hit:{b:c.b,d:c.d,p:c.p.clone(),n:c.n.clone(),push:c.push,front:c.front,vel}};
}
function judgeContacts(list){   // 接触しているボーンごとに、進入方向で失敗の種類を決める。失敗するなら、その接触を返す
  for(const b of [...graceMap.keys()])if(!list.some(c=>c.b===b))graceMap.delete(b);   // 判定範囲の外へ出たボーンの記録は消す
  let fail=null;const pick=c=>{if(!fail||c.d<fail.d)fail=c;},ga=FRONT_GRACE_ARC[mode]||0;   // このキャラの猶予
  for(const c of list){
    let g=graceMap.get(c.b);
    if(!g){g={front:c.front,a:segAngle(c.b.seg),snap:snapContact(c)};graceMap.set(c.b,g);}   // 進入方向は、接触した最初の瞬間で決める
    if(!(ga>0)){pick(c);continue;}   // 猶予なし(山田さん・ヴォルトマン): すぐ失敗
    c.front=g.front;   // 失敗の種類(正面=バランスを崩す / 横=押される)は進入方向のまま
    if(!g.front){pick(c);continue;}   // 横から入った: すぐ失敗(押される)
    if(Math.abs(segAngle(c.b.seg)-g.a)*BL>=ga)pick(c);   // 正面から入った: 先端が弧15cm回っても範囲内なら失敗(バランスを崩す)
  }
  return fail;
}
function rewindToContact(h){   // 失敗の確定ではなく、判定範囲に入った最初の瞬間に巻き戻して見せる
  const g=graceMap.get(h.b);if(!g||!g.snap)return h;
  const sn=g.snap;T=sn.T;time=sn.time;pz=sn.pz;anim=null;setPose(sn.pos);
  segs.forEach(sg=>{sg.pivot.rotation.z=segAngle(sg);});
  return Object.assign({},h,sn.hit,{front:g.front});
}
function hit(){const a=hitAll();return a.length?a[0]:false;}
function hitAll(){
  const r0=Math.max(HIT_START,boneRoot),cand=[],L=BL-r0,N=Math.ceil(L/.02),yb=H+hop,ht=bd.t/2,cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  const top=HEAD_HIT||!bd.head?bd.h:bd.head,pa=pose.a,hy=pose.hy,reach=Math.max(ht,pa+LEG_RADIUS)+BR+.01;
  const legs=[[-LEG_X,-pa],[LEG_X,pa]];   // [x, 足のz(体の中心から)] 左脚=前 / 右脚=後ろ
  for(const b of bones){
    const dz=b.z-pz;if(Math.abs(dz)>reach)continue;
    const sg=b.seg,th=b.a+segAngle(sg),cs=Math.cos(th),sn=Math.sin(th);
    for(let k=0;k<=N;k++){
      const r=r0+L*k/N,x=AXX+r*cs,y=AY+r*sn,yr=y-yb,yc=cl(yr,bd.hip,top),hw=bodyHW(yc);
      // 胴体(腰から上): 長方形断面の積層
      let d=Math.hypot(Math.max(0,Math.abs(x)-hw),Math.max(0,Math.abs(dz)-ht),Math.abs(yr-yc)),nx=cl(x,-hw,hw)-x,ny=yc-yr,nz=cl(dz,-ht,ht)-dz;
      // 脚: 腰(高さhy)から足(高さ0、前後にpa)までのカプセル
      for(const[lx,fz]of legs){
        const vy=-hy,t=cl(((y-H-hy)*vy+dz*fz)/(vy*vy+fz*fz),0,1);
        const ex=lx-x,ey=hy+t*vy-(y-H),ez=t*fz-dz,dist=Math.hypot(ex,ey,ez)-LEG_RADIUS;
        if(dist<d){d=Math.max(0,dist);nx=ex;ny=ey;nz=ez;}
      }
      if(d>=BR)continue;
      const vx=-sg.w*(y-AY),vyb=sg.w*(x-AXX),nxy=Math.hypot(nx,ny);   // ボーンの速度(面内)
      if(nxy>1e-4&&nxy>=Math.abs(nz)&&vx*nx+vyb*ny<0)continue;         // 面内の接触でボーンが体から遠ざかる向きなら失敗にしない
      cand.push({b,x,y,d,push:vx>=0?1:-1,nx,ny,nz});
    }
  }
  if(!cand.length)return [];
  const byB=new Map();for(const c of cand){const e=byB.get(c.b);if(!e||c.d<e.d)byB.set(c.b,c);}
  const out=[];
  for(const m of byB.values()){
    const ties=cand.filter(c=>c.b===m.b&&c.d<=m.d+.002),best=ties[ties.length>>1];
    const q=new THREE.Vector3(best.x,best.y,best.b.z),n=new THREE.Vector3(best.nx,best.ny,best.nz);
    if(n.length()<1e-4)n.set(1,0,0);
    n.normalize();
    best.n=n;best.p=q.clone().addScaledVector(n,BR);best.front=n.z>0&&Math.abs(n.z)>Math.hypot(n.x,n.y);
    out.push(best);
  }
  out.sort((a,b)=>a.d-b.d);
  return out;
}

  $('pause').classList.toggle('hide',state!=='play');

    time+=dt;

  }
  segs.forEach(sg=>{sg.pivot.rotation.z=segAngle(sg);});
  {
    const ok=state==='play'&&!anim,n1=Math.min(s+1,MAXS),n2=Math.min(s+2,MAXS);
    const put=(m,n,vis)=>{m.visible=ok&&vis;const big=n%2===0;m.scale.setScalar(big?.8:.4);m.material.depthTest=big;m.renderOrder=big?0:10;m.position.set(0,H+(big?.36:.2)+(big?.05:.03)*Math.sin(T*5),-n*S/2);};
    put(dot1,n1,n1>s);put(cone,n2,n2>n1);
  }
  if(state==='over'){
    fallT+=dt;
    const u=Math.min(fallT/FALL_TIME,1);let ay=H-FALL_DROP*u*u,rz=-FALL_TILT*u*failPush;
    if(mode==='vol'){ay=Math.max(ay,FLOAT_Y+.04*Math.sin(fallT*3));rz=-FLOAT_TILT*u*failPush;}
    avatar.position.set(FALL_PUSH*u*failPush,ay,pz);avatar.rotation.z=rz;
    zoomT=Math.min(zoomT+dt/FAIL_CAM_TIME,1);const k=1-Math.pow(1-zoomT,3);

const setPvPause=v=>{pvPaused=v;$('pvPause').textContent=v?'再開':'一時停止';};   // プレビューの一時停止/再開(障害物の動きを止める)
const pvTarget=()=>new THREE.Vector3(...titleCam.target);
const pvReset=()=>{const t=pvTarget(),o=new THREE.Vector3(...titleCam.pos).sub(t),d=o.length();pvYaw=Math.atan2(o.x,o.z);pvPitch=Math.asin(o.y/d);pvMax=Math.max(PV_ZOOM_MIN+1,d*PV_ZOOM_MAX_FACTOR);setSlider(pvToSlider(d));};   // 回転・ズームの初期値=タイトル画面のカメラの位置
const setPreview=v=>{previewOn=v;document.body.classList.toggle('preview',v);setPvPause(false);if(v)pvReset();};   // プレビュー: タイトルのボタン・文字・赤い画面効果を消して背景の映像だけを見せる
$('pv').onclick=()=>setPreview(true);
$('pvBack').onclick=()=>setPreview(false);
$('pvPause').onclick=()=>setPvPause(!pvPaused);
$('pause').onclick=()=>setPause(!paused);
$('back').onclick=toTitle;
loadCourse(courseIdx);
buildTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
